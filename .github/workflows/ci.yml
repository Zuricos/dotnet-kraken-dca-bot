name: CI

# Deliberately unfiltered: no `paths:` and no `branches:`.
#
# Remediation work targets the `review-and-fix` integration branch, not `main`, so a
# `branches: [main]` filter — which is what both publish workflows use — would leave every
# remediation PR ungated. A `paths:` filter would do the same for changes to
# Directory.Packages.props, Directory.Build.props, nuget.config or Kbot.sln, all of which are
# COPY'd into the images and can break the build on their own.
on:
  push:
  pull_request:
  # Called by the two publish workflows so `build-and-publish` cannot run on a red build.
  workflow_call:

# `github.workflow` is the *caller's* workflow name when this file runs via `workflow_call`, so a
# direct CI run and the runs the two publish workflows trigger land in three different groups
# instead of cancelling each other on a push to `main`.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  # The LiveExchange tests place REAL buy orders on live Kraken and send real mail.
  #
  # There is exactly ONE test-selection exclusion in this job: the `--filter` on the Test step.
  # It does not stack with `.runsettings` — passing a command-line filter takes the settings file
  # out of the picture entirely (see the Test step's comment). The other protections are not
  # selection-level and are what actually makes this durable:
  #   1. this variable, which LiveGuard.RequireOptIn() requires to be exactly "1"; pinning it to
  #      "0" here means no inherited runner environment can arm the tests that spend money;
  #   2. LiveGuard itself — but note it guards only the LiveExchange tests, NOT the LiveApi ones,
  #      so do not weaken the `--filter` on the assumption that something else will catch it.
  KBOT_ALLOW_LIVE_TRADING: "0"

jobs:
  ci:
    name: Build, test and format
    runs-on: ubuntu-latest
    # The real run is ~45 s. Without this the job inherits the 360-minute default, and because
    # both publish workflows call this workflow, one hung network read would hold a release
    # hostage for six hours instead of going red.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Pinned via global.json, not a floating "10.0.x". The Build step below runs
          # -warnaserror, so a runner picking up the first SDK that ships a new default warning
          # would turn an unrelated PR red — and a gate that goes red for reasons its author did
          # not cause is a gate people learn to ignore. global.json also keeps local and CI on the
          # same compiler: before this pin the runner resolved 10.0.400 while the maintainer built
          # on 10.0.300. `rollForward: latestPatch` still takes patches inside the 10.0.3xx band.
          global-json-file: global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Kbot.sln

      - name: Build
        run: dotnet build Kbot.sln --no-restore -c Release -warnaserror

      # This `--filter` is the ONLY test-selection exclusion in this job — it does not stack with
      # `.runsettings`. test/Directory.Build.props applies the settings file only when no
      # command-line filter was passed, so passing one here REPLACES the category exclusion
      # instead of being ANDed with it. Both category names must therefore be spelled out below;
      # dropping either one selects tests that talk to live Kraken.
      - name: Test
        run: |
          dotnet test Kbot.sln \
            --no-build \
            -c Release \
            --filter "TestCategory!=LiveExchange&TestCategory!=LiveApi" \
            --logger trx \
            --results-directory artifacts/test-results \
            --collect:"XPlat Code Coverage"

      # `!cancelled()` does not mask anything — the job still fails on a formatting violation. It
      # only means a single CI run reports build, test *and* format problems together instead of
      # stopping at the first one.
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: dotnet csharpier check .

      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 14
