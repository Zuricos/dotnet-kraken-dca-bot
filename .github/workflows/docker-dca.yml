name: Publish - DCA Service

on:
  push:
    branches:
      - main
    paths:
      - src/Kbot.Common/**
      - src/Kbot.DcaService/**
      - docker/**
      # These govern the build the image is produced from, so a change to any of them can alter
      # or break the shipped binaries on its own. Directory.Build.props, Directory.Packages.props
      # and nuget.config are COPY'd into the image; Kbot.sln and global.json are not, but they
      # decide which projects are built and which SDK builds them. A Dependabot bump to
      # Directory.Packages.props used to match none of these filters.
      - Directory.Build.props
      - Directory.Packages.props
      - nuget.config
      - Kbot.sln
      - global.json
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - src/Kbot.Common/**
      - src/Kbot.DcaService/**
      - docker/**
      - Directory.Build.props
      - Directory.Packages.props
      - nuget.config
      - Kbot.sln
      - global.json

jobs:
  compute-version:
    runs-on: ubuntu-latest
    steps:
      - name: Compute Version
        id: compute-version
        uses: Zuricos/gh-actions/compute-version@main
        with:
          prefix: dca
          # Must list the same files as the `paths:` triggers above: this is the change_path
          # semantic-version counts commits against, so without them a commit that only bumps
          # Directory.Packages.props computes needs_bump=false and no image is built.
          paths: "src/Kbot.Common src/Kbot.DcaService docker/Kbot.DcaService.Dockerfile Directory.Build.props Directory.Packages.props nuget.config Kbot.sln global.json"
    outputs:
      version: ${{ steps.compute-version.outputs.version }}
      suffix: ${{ steps.compute-version.outputs.suffix }}
      needsBump: ${{ steps.compute-version.outputs.needs_bump }}
      version_tag: ${{ steps.compute-version.outputs.version_tag }}

  # A job can only `needs:` a job in its own workflow, so gate on ci.yml by calling it.
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-publish:
    # `ci` is in `needs`, and a plain `if:` expression without a status function is ANDed with
    # the implicit success() over `needs` — so a red build or a formatting violation skips this
    # job, and nothing gets pushed to GHCR.
    needs: [compute-version, ci]
    # `== 'true'` matters. compute-version emits the literal strings "true" / "false" (see its
    # check_bump_version step); bare string truthiness made GitHub read "false" as true, so the
    # gate never actually skipped anything.
    if: ${{ needs.compute-version.outputs.needsBump == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and Publish Docker Image
        id: build_and_publish
        uses: Zuricos/gh-actions/docker-build-and-publish@main
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          context: .
          dockerfile: docker/Kbot.DcaService.Dockerfile
          image-name: kraken-dca-service
          version-tag: ${{ needs.compute-version.outputs.version }}${{ needs.compute-version.outputs.suffix }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Tag
        uses: Zuricos/gh-actions/push-tag@main
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          tag: ${{ needs.compute-version.outputs.version_tag }}${{ needs.compute-version.outputs.suffix }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/zuricos/kraken-dca-service
          subject-digest: ${{ steps.build_and_publish.outputs.image-digest }}
          push-to-registry: true
